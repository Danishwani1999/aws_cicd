name: ci-cd

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPO: aws-cicd-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: cd app && pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE=${{ steps.ecr.outputs.registry }}/${ECR_REPO}:$TAG
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Send deploy command to EC2 (SSM)
        run: |
          REGISTRY=${{ steps.ecr.outputs.registry }}

          # Script that runs on the EC2 instance
          cat > deploy.sh << 'EOS'
          #!/bin/bash
          set -u
          IMAGE="$1"; TAG="$2"; REGISTRY="$3"; REGION="$4"
          NAME=aws-cicd-demo

          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY" || exit 1
          docker pull "$IMAGE" || exit 1

          # Remember what is running now, for rollback
          PREV=$(docker inspect -f '{{.Config.Image}}' $NAME 2>/dev/null || true)
          PREV_TAG=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' $NAME 2>/dev/null | grep '^APP_VERSION=' | cut -d= -f2 || true)

          run_app() { docker run -d --name $NAME --restart unless-stopped -p 80:5000 -e APP_VERSION="$2" "$1"; }
          healthy() { for i in 1 2 3 4 5 6 7 8; do curl -fs http://localhost/health | grep -q "$1" && return 0; sleep 3; done; return 1; }

          docker stop $NAME 2>/dev/null || true
          docker rm $NAME 2>/dev/null || true
          run_app "$IMAGE" "$TAG"

          if healthy "$TAG"; then
            echo "Deployed $TAG OK"
            docker image prune -af --filter "until=72h"
            exit 0
          fi

          echo "New version $TAG failed health check. Container logs:"
          docker logs --tail 50 $NAME
          docker rm -f $NAME
          if [ -n "$PREV" ]; then
            echo "Rolling back to $PREV"
            run_app "$PREV" "$PREV_TAG"
          fi
          exit 1
          EOS

          B64=$(base64 -w0 deploy.sh)
          jq -n --arg b64 "$B64" --arg args "$IMAGE $TAG $REGISTRY $AWS_REGION" \
            '{commands: ["echo \($b64) | base64 -d > /tmp/deploy.sh", "bash /tmp/deploy.sh \($args)"]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "CMD_ID=$CMD_ID" >> $GITHUB_ENV

      - name: Wait for result and show output
        run: |
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text

          echo "Final status: $STATUS"
          test "$STATUS" = "Success"
