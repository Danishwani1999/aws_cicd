name: ci-cd

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: aws-cicd-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: cd app && pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE=${{ steps.ecr.outputs.registry }}/${ECR_REPO}:$TAG
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to EC2 with SSM
        run: |
          REGISTRY=${{ steps.ecr.outputs.registry }}
          cat > params.json << JSON
          {"commands":[
          "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
          "docker pull $IMAGE",
          "docker stop aws-cicd-demo || true",
          "docker rm aws-cicd-demo || true",
          "docker run -d --name aws-cicd-demo --restart unless-stopped -p 80:5000 -e APP_VERSION=$TAG $IMAGE",
          "for i in 1 2 3 4 5; do curl -fs http://localhost/health && exit 0; sleep 3; done; exit 1"
          ]}
          JSON
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent}"
