version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: aws-cicd-demo

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - pip install -r app/requirements.txt pytest
      - cd app && pytest -q && cd ..
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
      - TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" | cut -c1-7)
      - TAG=${TAG:-build$CODEBUILD_BUILD_NUMBER}

  build:
    commands:
      - docker build -t $REGISTRY/$IMAGE_REPO_NAME:$TAG .
      - docker tag $REGISTRY/$IMAGE_REPO_NAME:$TAG $REGISTRY/$IMAGE_REPO_NAME:latest

  post_build:
    commands:
      - docker push $REGISTRY/$IMAGE_REPO_NAME:$TAG
      - docker push $REGISTRY/$IMAGE_REPO_NAME:latest
      - echo "IMAGE_URI=$REGISTRY/$IMAGE_REPO_NAME:$TAG" > deploy.env
      - echo "AWS_REGION=$AWS_DEFAULT_REGION" >> deploy.env

artifacts:
  files:
    - appspec.yml
    - deploy.env
    - scripts/**/*

